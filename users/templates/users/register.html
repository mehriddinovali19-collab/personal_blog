{% extends "blog/base.html" %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-description">
            Create your account to start using the blog.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="primary-button">
                Register
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}

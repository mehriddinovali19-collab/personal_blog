{% extends "blog/base.html" %}

{% block title %}
    Home
{% endblock %}

{% block content %}

<h1>Welcome to my Personal Blog</h1>

{% for post in posts %}

<article>
    <h2>
        <a href="{% url 'post_detail' post.slug %}">
            {{ post.title }}
        </a>
    </h2>

    <p>
        {{ post.content|truncatewords:30 }}
    </p>

    <p>
        {{ post.created_at }}
    </p>
</article>

{% empty %}

<p>No posts yet.</p>

{% endfor %}

{% endblock %}

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            My Blog
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav>

        <a href="{% url 'home' %}">
            My Blog
        </a>

        <a href="{% url 'post_list' %}">
            Blog
        </a>

        <a href="{% url 'category_list' %}">
            Categories
        </a>

        <a href="{% url 'search_posts' %}">
            Search
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'post_create' %}">
                Create Post
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </nav>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            © 2026 My Blog
        </p>

    </footer>

</body>

</html>

{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Personal Blog
        {% endblock %}
    </title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>

<body>

<header>
    <nav>
        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'post_list' %}">
            Blog
        </a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>© 2026 My Personal Blog</p>
</footer>

<!-- JavaScript -->
<script src="{% static 'blog/js/main.js' %}"></script>

</body>
</html>

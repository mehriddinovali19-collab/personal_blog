{% extends "blog/base.html" %}

{% block title %}
Add Comment
{% endblock %}

{% block content %}

<div class="post-card">

```
<h1>Add Comment</h1>

<p>
    Commenting on:
    <strong>{{ post.title }}</strong>
</p>

<br>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Add Comment
    </button>

</form>

<br>

<p>
    <a href="{% url 'post_detail' post.slug %}">
        ← Back to Post
    </a>
</p>
```

</div>

{% endblock %}

{% extends "blog/base.html" %}

{% block title %}
Categories
{% endblock %}

{% block content %}

<h1>Categories</h1>

{% for category in categories %}

<div class="post-card">

```
<h2>
    <a href="{% url 'category_posts' category.slug %}">
        {{ category.name }}
    </a>
</h2>

<p>
    View posts in {{ category.name }} category.
</p>
```

</div>

{% empty %}

<p>Hozircha kategoriyalar mavjud emas.</p>

{% endfor %}

{% endblock %}

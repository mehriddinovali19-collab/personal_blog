{% extends "blog/base.html" %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}

<div class="post-card">

```
<h1>Delete Post</h1>

<p>
    Are you sure you want to delete
    "<strong>{{ post.title }}</strong>"?
</p>

<br>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'post_detail' post.slug %}">
        Cancel
    </a>

</form>
```

</div>

{% endblock %}

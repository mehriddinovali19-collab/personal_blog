```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts</title>
</head>
<body>

    <h1>All Posts</h1>

    {% for post in posts %}

        <article>
            <h2>{{ post.title }}</h2>

            <p>{{ post.content|truncatewords:30 }}</p>

            <p>
                Published: {{ post.created_at }}
            </p>

            <a href="{% url 'post_detail' post.id %}">
                Read more
            </a>
        </article>

        <hr>

    {% empty %}

        <p>No posts available.</p>

    {% endfor %}

</body>
</html>
```

{% extends "blog/base.html" %}

{% block title %}
Blog
{% endblock %}

{% block content %}

<h1>Blog Posts</h1>

{% for post in posts %}

<div class="post-card">

```
<h2>
    <a href="{% url 'post_detail' post.slug %}">
        {{ post.title }}
    </a>
</h2>

<p>
    {{ post.content|truncatewords:30 }}
</p>
```

</div>

{% empty %}

<p>Hozircha postlar mavjud emas.</p>

{% endfor %}

{% endblock %}
